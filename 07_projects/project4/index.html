<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <link rel="stylesheet" href="style.css">
     
</head>
<body>
    <nav>
        <a href="#" class="btn-link" id="home">Home</a>
        <a href="https://www.youtube.com/" class="btn-link" id="yt">Youtube Channel</a>

    </nav>
    <h2>Number guessing game</h2>
    <div class="container">
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>

        <div id="number">
            
            <form class="form">
                <label for="guessField" id="guess">Guess a number</label><br>
                <input type="text" id="guessField" class="guessField"><br>
                <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
            </form>
            <div class="resultParas">
                <p>Previous guesses: <span class="guesses"></span></p>
                <p>Guesses remaining: <span class="lastResult">10</span></p>
                <p class="lowOrHi"></p>
            </div>
        </div>
    </div>
    <script src="p4_scripts.js"></script>
    
</body>
</html>
