<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Selector</title>
    <link rel="stylesheet" href="style.css">
     
</head>
<body>
    <nav>
        <a href="#" class="btn-link" id="home">Home</a>
        <a href="https://www.youtube.com/" class="btn-link" id="yt">Youtube Channel</a>

    </nav>
    <h2>Number guessing game</h2>
    <div class="container">
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>

        <div id="number">
            <h1>Guess a number</h1>
            <form>
                <input class="number"><br><br>
                <button type="button">Submit guess</button>
            </form>
            <span>Previous guesses: </span><br>
            <span>Guesses remaining: </span>
        </div>
    </div>
    <script src="p4_scripts.js"></script>
    
</body>
</html>
