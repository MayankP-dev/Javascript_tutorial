<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Selector</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        *{
        padding: 0px;
        margin: 0px;
        }

        nav{
            display: flex;
            justify-content: center;
            gap: 5px;
            background-color: lightgrey;
            padding: 10px;
            border-bottom: 2px solid grey;
        }

        .btn-link{
            padding: 5px 10px;
            border: 2px solid black;
            background-color: beige;
            border-radius: 5px;
            color: black;
            text-decoration: none;  
        }

        body{
            background-color: #212122;
            text-align: center;
        }

        h2{
            color: white;
        }

        .center{
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #time{
            width: 150px;
            height: 50px;
            border-radius: 100px;
            background-color: #ff9f0a;
            color: white;
            font-size: large;
            font-display: block;
            
        }
        
     </style>
</head>
<body>
    <nav>
        <a href="#" class="btn-link" id="home">Home</a>
        <a href="https://www.youtube.com/" class="btn-link" id="yt">Youtube Channel</a>

    </nav>
    <div class="center">
        <div id="banner"><h2>Your local time</h2></div>
        <div id="time"></div>
    </div>
    <script src="p3_scripts.js"></script>
    
</body>
</html>
