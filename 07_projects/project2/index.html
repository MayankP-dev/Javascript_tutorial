<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#" class="btn-link" id="home">Home</a>
        <a href="#" class="btn-link" id="yt">Youtube Channel</a>

    </nav>
    <h2>BMI Calculator</h2>
    <div class="container">
        <form>
            <label for="height">Height in cm: </label>
            <input type="number" id="height"><br><br>
            <label for="weight">weight in kg: </label>
            <input type="number" id="weight"><br><br>
            <!-- <input type="button" value="CALCULATE" id="calculate"> -->
            <button>Calculate</button>
        </form>
        <div id="result"></div>

        <h3>BMI weight guide</h3>
        <p>Under weight = Less than 18.60</p>
        <p>Normal range = 18.60 and 24.90</p>
        <p>Overweight = Greater than 24.90</p>
    </div>
    <script src="p2_scripts.js"></script>
    
</body>
</html>
